name: Publish Preflight Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm ci

      - name: Run publish checks
        run: |
          npm run ci:publish-check
